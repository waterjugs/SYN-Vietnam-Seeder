name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pyinstaller --onefile --name SynSeeder --add-data "templates;templates" run_seeder.py
      - uses: actions/upload-artifact@v4
        with:
          name: SynSeeder
          path: dist/SynSeeder.exe
