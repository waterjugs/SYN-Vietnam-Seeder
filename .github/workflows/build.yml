name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to publish releases from tags

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: pyinstaller --onefile --noconsole --name SynSeeder --add-data "templates;templates" run_seeder.py
      - uses: actions/upload-artifact@v4
        with:
          name: SynSeeder
          path: dist/SynSeeder.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/SynSeeder.exe \
            --title "SynSeeder ${{ github.ref_name }}" \
            --notes "Download SynSeeder.exe below and double-click it. See the README for setup."
