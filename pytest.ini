[pytest]
# Capture print() output without swapping the process's stdout/stderr handles.
# On Windows, Tcl keeps the stdout/stderr handles it found when the first window
# opened. pytest's fd capture closes and replaces them around every test, Windows
# then hands the same handle numbers to files Tcl opens later (init.tcl, tclIndex),
# and Tcl mistakes them for its old stdout/stderr and refuses to read them.
addopts = --capture=sys
